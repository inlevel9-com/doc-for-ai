        tl.to("#ap-cursor", { x: 200, y: 700, duration: 0.6, ease: "power3.inOut" }, 2.0);
        tl.fromTo("#ap-go", { scale: 1 }, { scale: 0.95, duration: 0.06, ease: "power2.in" }, 2.8);
        tl.to("#ap-go", { scale: 1, duration: 0.1, ease: "power2.out" }, 2.86);
        tl.fromTo("#ap-go .idle", { opacity: 1 }, { opacity: 0, duration: 0.1 }, 2.9);
        tl.fromTo("#ap-go .busy", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 2.95);
        tl.to("#ap-cursor", { x: 760, y: 980, duration: 0.5, ease: "power2.inOut" }, 3.0);
        // 진행 막대와 초록 완료 표시
        tl.fromTo("#ap-bar", { scaleX: 0 }, { scaleX: 1, duration: 3.2, ease: "none" }, 3.0);
        tl.fromTo("#ap-rows .trow .wait", { opacity: 1 }, { opacity: 0, duration: 0.12, stagger: 0.25 }, 3.1);
        tl.fromTo("#ap-rows .trow .ok", { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out", stagger: 0.25 }, 3.1);
        tl.fromTo("#ap-rows .trow .fname, #ap-rows .trow .kind", { color: "#111827" }, { color: "#15803d", duration: 0.2, stagger: { each: 0.25, from: 0 } }, 3.1);

        tl.to("#ap-go .idle", { opacity: 1, duration: 0.1 }, 6.25);
        tl.fromTo("#ap-ready", { opacity: 1 }, { opacity: 0, duration: 0.12 }, 6.2);
        tl.fromTo("#ap-done", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.25);
        tl.fromTo("#ap-open", { color: "#6b7280" }, { color: "#111827", duration: 0.2 }, 6.25);
        tl.to("#ap-cursor", { opacity: 0, duration: 0.2 }, 6.3);
        // hwpx 체크 항목이 빛난 뒤, 창이 흐려지고 '변환결과' 폴더 카드가 떠서 .md .json .hwpx 를 보여 준다

        tl.fromTo("#ap-result", { opacity: 0, scale: 0.86, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.3)" }, 6.55);
        tl.fromTo("#ap-result .rrow", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out", stagger: 0.12 }, 6.75);
