        .titlebar .controls { margin-left: auto; display: flex; gap: 26px; color: #4b5563; font-size: 15px; }
        .folder { width: 24px; height: 20px; position: relative; }
        .folder::before { content: ""; position: absolute; left: 0; top: 0; width: 10px; height: 6px; background: #f2b84b; border-radius: 2px 2px 0 0; }
        .folder::after { content: ""; position: absolute; left: 0; top: 4px; width: 24px; height: 16px; background: #f8c96a; border-radius: 2px; }
        .address { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; color: #374151; border-bottom: 1px solid #eef0f3; }

        .address .box span { color: #9ca3af; }
        .head { display: grid; grid-template-columns: 1fr 190px 130px 90px; padding: 8px 20px; font-size: 13px; color: #6b7280; border-bottom: 1px solid #eef0f3; }
        .rows { flex: 1; padding: 6px 8px; }
        .row { display: grid; grid-template-columns: 1fr 190px 130px 90px; align-items: center; padding: 0 12px; height: 52px; font-size: 20px; border-radius: 6px; }
        .row:nth-child(odd) { background: #fafafa; }
        .row .name { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .row .meta { color: #4b5563; font-size: 16px; }
        .badge { width: 34px; height: 40px; border-radius: 5px; background: #e8eefc; border: 1px solid #c7d2fe; color: #1d4ed8; font-size: 11px; font-weight: 700;
                 display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; letter-spacing: 0.02em; }
        .statusbar { height: 38px; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #4b5563; background: #f9fafb; border-top: 1px solid #eef0f3; }
        #ex-chip { position: absolute; left: 150px; top: 380px; width: 230px; height: 86px; border-radius: 14px; background: #ffffff; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
                   display: flex; align-items: center; gap: 14px; padding: 0 18px; font-size: 24px; font-weight: 700; opacity: 0; }
        #ex-chip .folder { width: 44px; height: 36px; }
        #ex-chip .folder::before { width: 18px; height: 10px; }
        #ex-chip .folder::after { top: 7px; width: 44px; height: 29px; }
        #ex-cursor { position: absolute; left: 0; top: 0; width: 70px; height: 70px; opacity: 0; }

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ex-win", { scale: 0.985, y: 14 }, { scale: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0);
        tl.fromTo("#ex-rows .row", { opacity: 0.4, x: -18 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", stagger: 0.04 }, 0);
        // 커서가 오른쪽 아래에서 들어와 제목 표시줄의 폴더로 간다

        tl.to("#ex-cursor", { x: 120, y: 170, duration: 0.5, ease: "power2.inOut" }, 2.9);
        // 집는 순간: 폴더 칩이 나타나 커서를 따라 화면 아래로 끌려 나간다
        tl.set("#ex-chip", { x: -40, y: -230 }, 0);
        tl.fromTo("#ex-chip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.6)" }, 3.3);
        tl.to("#ex-cursor", { x: 560, y: 330, duration: 0.7, ease: "power3.inOut" }, 3.45);
        tl.to("#ex-chip", { x: 290, y: -150, duration: 0.7, ease: "power3.inOut" }, 3.45);
        tl.to("#ex-win", { opacity: 0, filter: "blur(14px)", scale: 0.97, duration: 0.6, ease: "power2.in" }, 3.6);
        window.__timelines["explorer"] = tl;
