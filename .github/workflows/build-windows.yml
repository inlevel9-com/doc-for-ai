name: Build Windows package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install and test
        run: |
          python -m pip install ".[test]"
          python -m pytest -q
      - name: Prepare wheelhouse
        shell: pwsh
        run: .\scripts\download-wheels.ps1
      - name: Build from local wheels
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - name: Check portable ZIP
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter 'docforai-v*-windows-x64.zip' -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows ZIP."
          }
          $extracted = Join-Path $env:RUNNER_TEMP 'docforai-package'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extracted
          $bundle = Join-Path $extracted 'docforai'
          foreach ($file in @('docforai.exe', 'LICENSE', 'usage.txt', 'docs/OFFLINE.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $file) -PathType Leaf)) {
              throw "The Windows ZIP is missing $file."
            }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: docforai-windows-x64
          path: dist/docforai-v*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: docforai-windows-x64
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="dist/docforai-${TAG}-windows-x64.zip"
          if [ ! -f "$archive" ]; then
            echo "::error::Expected $archive. The tag must match the version in pyproject.toml."
            ls -l dist
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$archive" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
